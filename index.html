<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新加坡时间 · Singapore Time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="flag">🇸🇬</div>
    <h1>Singapore Time</h1>
    <p class="zone">Asia/Singapore · UTC+8</p>

    <div id="clock" class="clock" aria-live="off">--:--:--</div>
    <div id="date" class="date">—</div>

    <div class="meta">
      <span id="offset" class="badge">UTC+08:00</span>
      <span id="tzname" class="badge">—</span>
    </div>
  </main>

  <footer>每秒自动同步 · Synced every second</footer>

  <script src="script.js"></script>
</body>
</html>
